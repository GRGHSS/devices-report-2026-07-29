<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Տեղեկանք սարքերի վերաբերյալ | 29.07.2026</title>
    <style>
      :root {
        --ink: #172f45;
        --muted: #657685;
        --line: #cfd9df;
        --soft-line: #e5ebef;
        --surface: #ffffff;
        --canvas: #eef3f6;
        --blue: #176985;
        --green: #237a42;
        --amber: #ba7b1e;
        --red: #a64736;
        --cyan: #1ca0bf;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Segoe UI", Arial, sans-serif;
        letter-spacing: 0;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .app-header {
        background: #172f45;
        color: #fff;
        border-bottom: 4px solid var(--cyan);
      }
      .header-inner, .page, footer {
        width: min(1500px, calc(100% - 40px));
        margin: 0 auto;
      }
      .header-inner {
        min-height: 96px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .header-inner p {
        margin: 0 0 4px;
        color: #6fd1e4;
        font-size: 11px;
        font-weight: 750;
        text-transform: uppercase;
      }
      .header-inner h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.2;
      }
      .header-date {
        padding-left: 20px;
        border-left: 1px solid #ffffff40;
        display: grid;
        gap: 3px;
      }
      .header-date span { color: #b8c8d4; font-size: 11px; }
      .header-date strong { font-size: 17px; }
      .page { padding: 22px 0 42px; }
      .toolbar {
        min-height: 58px;
        margin-bottom: 16px;
        padding: 9px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .toolbar-status {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 12px;
      }
      .status-dot {
        width: 9px;
        height: 9px;
        background: var(--green);
        border-radius: 50%;
      }
      .toolbar-actions { display: flex; gap: 8px; }
      .toolbar button {
        height: 36px;
        padding: 0 14px;
        background: #fff;
        border: 1px solid #bfcdd6;
        border-radius: 4px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 650;
      }
      .toolbar .primary {
        background: #176985;
        border-color: #176985;
        color: #fff;
      }
      .document {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .document-heading {
        padding: 26px 24px 20px;
        text-align: center;
        border-bottom: 1px solid var(--line);
      }
      .document-heading h2 {
        margin: 0 0 6px;
        font-size: 20px;
        text-transform: uppercase;
      }
      .document-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .table-scroll { width: 100%; overflow-x: auto; }
      table {
        width: 100%;
        min-width: 1320px;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th, td {
        border-right: 1px solid #dbe3e8;
        border-bottom: 1px solid #dbe3e8;
        text-align: right;
        vertical-align: middle;
      }
      th:last-child, td:last-child { border-right: 0; }
      thead tr:first-child th {
        padding: 11px 8px;
        background: #1d6079;
        color: #fff;
        font-size: 11px;
        vertical-align: middle;
      }
      thead tr:nth-child(2) th {
        padding: 8px 6px;
        background: #dfeaf0;
        color: var(--ink);
        font-size: 10px;
      }
      th:nth-child(1) { width: 46px; }
      th:nth-child(2) { width: 96px; }
      th:nth-child(3) { width: 190px; }
      th:nth-child(4) { width: 105px; }
      th:last-child { width: 170px; }
      td {
        height: 58px;
        padding: 7px 8px;
        color: #324b5d;
        font-size: 12px;
      }
      tbody tr:hover { background: #f6fafc; }
      .device-name {
        color: var(--ink);
        font-weight: 750;
      }
      .serial-range {
        font-family: Consolas, "Courier New", monospace;
        font-size: 11px;
        line-height: 1.4;
      }
      .number-input {
        width: 82px;
        height: 36px;
        padding: 0 7px;
        background: #fbfdfe;
        border: 1px solid #bfcdd6;
        border-radius: 3px;
        color: var(--ink);
        font-weight: 650;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .number-input:focus {
        outline: 0;
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px #1ca0bf20;
      }
      .note-input {
        width: 100%;
        height: 36px;
        padding: 0 8px;
        border: 1px solid #bfcdd6;
        border-radius: 3px;
        color: var(--ink);
      }
      .difference {
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }
      .difference.bad { color: var(--red); }
      tfoot td {
        height: 54px;
        background: #edf3f6;
        color: var(--ink);
        font-weight: 750;
      }
      .analysis-grid {
        display: grid;
        grid-template-columns: .85fr 1.15fr;
        border-top: 16px solid var(--canvas);
      }
      .chart-panel {
        min-width: 0;
        padding: 22px;
      }
      .chart-panel + .chart-panel { border-left: 1px solid var(--line); }
      .chart-heading {
        margin-bottom: 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
      }
      .chart-heading p {
        margin: 0 0 4px;
        color: var(--cyan);
        font-size: 10px;
        font-weight: 750;
        text-transform: uppercase;
      }
      .chart-heading h3 {
        margin: 0;
        font-size: 17px;
      }
      .chart-heading span {
        padding: 4px 7px;
        background: #edf3f6;
        border-radius: 3px;
        color: var(--muted);
        font-size: 10px;
      }
      .donut-layout {
        min-height: 265px;
        display: grid;
        grid-template-columns: minmax(180px, .9fr) minmax(180px, 1.1fr);
        align-items: center;
        gap: 24px;
      }
      .donut {
        width: min(100%, 230px);
        aspect-ratio: 1;
        margin: auto;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .donut-hole {
        width: 58%;
        aspect-ratio: 1;
        background: #fff;
        border-radius: 50%;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .donut-hole strong { font-size: 24px; line-height: 1; }
      .donut-hole span { margin-top: 5px; color: var(--muted); font-size: 10px; }
      .legend { display: grid; gap: 12px; }
      .legend-row {
        display: grid;
        grid-template-columns: 10px 1fr auto auto;
        align-items: center;
        gap: 8px;
        color: #425b6d;
        font-size: 11px;
      }
      .swatch { width: 10px; height: 10px; border-radius: 2px; }
      .legend-row strong { color: var(--ink); }
      .legend-row em { min-width: 45px; color: var(--muted); font-style: normal; text-align: right; }
      .stack-list { display: grid; gap: 19px; }
      .stack-meta {
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #40596a;
        font-size: 11px;
      }
      .stack-meta strong { color: var(--ink); }
      .stack {
        height: 18px;
        overflow: hidden;
        background: #e8eef2;
        border-radius: 3px;
        display: flex;
      }
      .segment { display: block; height: 100%; }
      .stack-key {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 13px;
      }
      .stack-key span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 10px;
      }
      .stack-key i { width: 9px; height: 9px; border-radius: 2px; }
      .validation {
        margin: 16px;
        padding: 13px 16px;
        background: #f1f8f3;
        border: 1px solid #bddcc5;
        border-left: 4px solid var(--green);
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        color: #496252;
        font-size: 11px;
      }
      .validation.bad {
        background: #fff4f1;
        border-color: #e6bdb5;
        border-left-color: var(--red);
        color: #7d4439;
      }
      footer {
        padding: 18px 0 24px;
        border-top: 1px solid #d3dde3;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        color: #738493;
        font-size: 10px;
      }
      .loading {
        min-height: 100vh;
        display: grid;
        place-content: center;
        color: var(--muted);
      }
      .pin-dialog {
        width: min(92vw, 380px);
        border: 0;
        border-radius: 8px;
        padding: 0;
        color: var(--ink);
        box-shadow: 0 24px 70px rgba(20, 35, 30, 0.28);
      }
      .pin-dialog::backdrop { background: rgba(20, 35, 30, 0.48); }
      .pin-form { padding: 24px; }
      .pin-form h3 { margin: 0 0 8px; font-size: 20px; }
      .pin-form p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
      .pin-form label { display: grid; gap: 8px; font-weight: 700; }
      .pin-form input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
        letter-spacing: 0;
      }
      .pin-form input:focus { outline: 2px solid rgba(35, 122, 66, 0.25); border-color: var(--green); }
      .pin-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
      @media (max-width: 980px) {
        .analysis-grid { grid-template-columns: 1fr; }
        .chart-panel + .chart-panel { border-left: 0; border-top: 1px solid var(--line); }
      }
      @media (max-width: 680px) {
        .header-inner, .page, footer { width: min(100% - 24px, 1500px); }
        .header-inner { min-height: 88px; }
        .header-inner h1 { font-size: 20px; }
        .toolbar { align-items: flex-start; flex-direction: column; }
        .toolbar-actions { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
        .donut-layout { grid-template-columns: 1fr; }
        .validation, footer { flex-direction: column; }
      }
      @media print {
        body { background: #fff; }
        .app-header, .toolbar, footer { display: none; }
        .page { width: 100%; padding: 0; }
        .document { border: 0; }
        .analysis-grid { break-before: page; }
        .number-input, .note-input { border: 0; background: transparent; }
        @page { size: A4 landscape; margin: 10mm; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading">Բեռնվում է տեղեկանքը…</div>
    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbxvsBy1qS55GEUKDvIL8IKGPOQ38zqDG9qDvj76Cg5qRwpVzFc6174cSa5OUo31ecUkUA/exec";
      const nf = new Intl.NumberFormat("hy-AM");
      const pf = new Intl.NumberFormat("hy-AM", { style: "percent", maximumFractionDigits: 1 });
      const colors = {
        installed: "#237a42",
        reserve: "#d3982f",
        damaged: "#c0523d",
        service: "#287c9d",
        lost: "#7c536f",
        other: "#8b98a2"
      };
      const PUBLISHED_ROWS = [
        { sourceType: "MU/HU", label: "SU/HU", serialRange: "101,010–94,361,921", total: 1283, installed: 922, reserve: 165, damaged: 48, service: 148, lost: 0, other: 0, note: "" },
        { sourceType: "PID/RFT", label: "RFT", serialRange: "111,111–21,669,046", total: 2506, installed: 1440, reserve: 443, damaged: 347, service: 254, lost: 22, other: 0, note: "" },
        { sourceType: "GPS/OPT", label: "OPT", serialRange: "4,251,323–12,650,069", total: 1145, installed: 898, reserve: 42, damaged: 17, service: 186, lost: 2, other: 0, note: "" },
        { sourceType: "VTU/TPT", label: "TPT", serialRange: "900,100–906,647", total: 752, installed: 518, reserve: 39, damaged: 111, service: 61, lost: 23, other: 0, note: "" }
      ];
      let rows = [];
      let initialRows = [];

      const sum = (items, field) => items.reduce((total, row) => total + Number(row[field] || 0), 0);
      const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
      function difference(row) {
        return row.total - row.installed - row.reserve - row.damaged - row.service - row.lost - row.other;
      }

      function requestPin() {
        const dialog = document.querySelector("#pin-dialog");
        const form = document.querySelector("#pin-form");
        const input = document.querySelector("#pin-input");
        const cancel = document.querySelector("#pin-cancel");
        input.value = "";
        dialog.showModal();
        input.focus();

        return new Promise(resolve => {
          const finish = value => {
            form.removeEventListener("submit", submit);
            cancel.removeEventListener("click", cancelEntry);
            dialog.removeEventListener("cancel", cancelDialog);
            dialog.close();
            resolve(value);
          };
          const submit = event => {
            event.preventDefault();
            finish(input.value.trim());
          };
          const cancelEntry = () => finish(null);
          const cancelDialog = event => {
            event.preventDefault();
            finish(null);
          };
          form.addEventListener("submit", submit);
          cancel.addEventListener("click", cancelEntry);
          dialog.addEventListener("cancel", cancelDialog);
        });
      }

      function tableRows() {
        return rows.map((row, index) => `
          <tr>
            <td>${index + 1}</td>
            <td class="device-name">${esc(row.label)}</td>
            ${["total","installed","reserve","damaged","service","other","lost"].map(field => `
              <td><input class="number-input" type="number" min="0" step="1" value="${row[field]}" data-index="${index}" data-field="${field}" aria-label="${esc(row.label)} ${field}" /></td>
            `).join("")}
            <td><span class="difference ${difference(row) ? "bad" : ""}" id="difference-${index}">${nf.format(difference(row))}</span></td>
          </tr>
        `).join("");
      }

      function totalsRow() {
        return `
          <tr>
            <td></td><td>Ընդամենը</td>
            ${["total","installed","reserve","damaged","service","other","lost"].map(field => `<td id="total-${field}">${nf.format(sum(rows, field))}</td>`).join("")}
            <td id="total-difference">${nf.format(rows.reduce((total, row) => total + difference(row), 0))}</td>
          </tr>
        `;
      }

      function donutMarkup() {
        const parts = [
          ["Կիրառված", sum(rows, "installed"), colors.installed],
          ["Չկիրառված", sum(rows, "reserve"), colors.reserve],
          ["Պահեստում՝ սարքին", sum(rows, "damaged"), colors.damaged],
          ["Անսարք՝ երաշխիքով", sum(rows, "service"), colors.service],
          ["Անսարք՝ առանց երաշխիքի", sum(rows, "other"), colors.other],
          ["Կորուստ", sum(rows, "lost"), colors.lost]
        ];
        const total = parts.reduce((value, part) => value + part[1], 0) || 1;
        let cursor = 0;
        const stops = parts.map((part) => {
          const start = cursor;
          cursor += part[1] / total * 100;
          return `${part[2]} ${start}% ${cursor}%`;
        });
        return `
          <div class="donut-layout">
            <div class="donut" style="background:conic-gradient(${stops.join(",")})">
              <div class="donut-hole"><strong>${nf.format(total)}</strong><span>բաշխված սարք</span></div>
            </div>
            <div class="legend">
              ${parts.map(part => `
                <div class="legend-row">
                  <span class="swatch" style="background:${part[2]}"></span>
                  <span>${part[0]}</span>
                  <strong>${nf.format(part[1])}</strong>
                  <em>${pf.format(part[1] / total)}</em>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      function stackMarkup() {
        return `
          <div class="stack-list">
            ${rows.map(row => {
              const denominator = row.total || 1;
              const segments = [
                [row.installed, colors.installed],
                [row.reserve, colors.reserve],
                [row.damaged, colors.damaged],
                [row.service, colors.service],
                [row.other, colors.other],
                [row.lost, colors.lost]
              ];
              return `
                <div>
                  <div class="stack-meta"><span>${esc(row.label)}</span><strong>${nf.format(row.total)} սարք</strong></div>
                  <div class="stack">
                    ${segments.map(segment => `<span class="segment" style="width:${Math.max(segment[0] / denominator * 100, segment[0] ? .5 : 0)}%;background:${segment[1]}"></span>`).join("")}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="stack-key">
            <span><i style="background:${colors.installed}"></i>Կիրառված</span>
            <span><i style="background:${colors.reserve}"></i>Չկիրառված</span>
            <span><i style="background:${colors.damaged}"></i>Պահեստում՝ սարքին</span>
            <span><i style="background:${colors.service}"></i>Անսարք՝ երաշխիքով</span>
            <span><i style="background:${colors.other}"></i>Անսարք՝ առանց երաշխիքի</span>
            <span><i style="background:${colors.lost}"></i>Կորուստ</span>
          </div>
        `;
      }

      function updateDerived() {
        ["total","installed","reserve","damaged","service","lost","other"].forEach(field => {
          document.querySelector(`#total-${field}`).textContent = nf.format(sum(rows, field));
        });
        rows.forEach((row, index) => {
          const cell = document.querySelector(`#difference-${index}`);
          const value = difference(row);
          cell.textContent = nf.format(value);
          cell.classList.toggle("bad", value !== 0);
        });
        const totalDifference = rows.reduce((total, row) => total + difference(row), 0);
        document.querySelector("#total-difference").textContent = nf.format(totalDifference);
        document.querySelector("#donut-area").innerHTML = donutMarkup();
        document.querySelector("#stack-area").innerHTML = stackMarkup();
        const validation = document.querySelector("#validation");
        validation.classList.toggle("bad", totalDifference !== 0);
        validation.innerHTML = totalDifference === 0
          ? `<strong>Հաշվեկշիռը համընկնում է</strong><span>Բոլոր խմբերի գումարը հավասար է «Ընդամենը» ցուցանիշին։</span>`
          : `<strong>Հաշվեկշռի տարբերություն՝ ${nf.format(totalDifference)}</strong><span>Ստուգեք կարմիր տարբերությամբ տողերը։</span>`;
      }

      function bindInputs() {
        document.querySelectorAll("input[data-index]").forEach(input => {
          input.addEventListener("input", event => {
            const index = Number(event.target.dataset.index);
            const field = event.target.dataset.field;
            rows[index][field] = field === "note" ? event.target.value : Math.max(0, Number(event.target.value || 0));
            updateDerived();
            document.querySelector("#save-state").textContent = "Չպահպանված փոփոխություններ";
          });
        });
        document.querySelector("#save").addEventListener("click", async () => {
          const pin = await requestPin();
          if (pin === null) return;

          const saveButton = document.querySelector("#save");
          saveButton.disabled = true;
          document.querySelector("#save-state").textContent = "Պահպանվում է առցանց…";
          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ pin, rows })
            });
            const result = await response.json();
            if (!result.ok) {
              throw new Error(result.error || "SAVE_FAILED");
            }
            rows = structuredClone(result.rows);
            initialRows = structuredClone(result.rows);
            render();
            document.querySelector("#save-state").textContent =
              `Առցանց պահպանված է${result.updatedAt ? ` · ${result.updatedAt}` : ""}`;
          } catch (error) {
            const message = error.message === "INVALID_PIN"
              ? "Խմբագրման կոդը սխալ է։"
              : "Տվյալները չպահպանվեցին։ Ստուգեք ինտերնետ կապը և կրկին փորձեք։";
            document.querySelector("#save-state").textContent = message;
            saveButton.disabled = false;
          }
        });
        document.querySelector("#reset").addEventListener("click", () => {
          rows = structuredClone(initialRows);
          render();
          document.querySelector("#save-state").textContent = "Վերջին առցանց տվյալները վերականգնված են";
        });
        document.querySelector("#print").addEventListener("click", () => window.print());
      }

      function render() {
        document.querySelector("#app").className = "";
        document.querySelector("#app").innerHTML = `
          <header class="app-header">
            <div class="header-inner">
              <div><p>Էլեկտրոնային մոնիթորինգ</p><h1>Սարքերի հաշվետվություն</h1></div>
              <div class="header-date"><span>Դրությունը</span><strong>29.07.2026</strong></div>
            </div>
          </header>
          <main class="page">
            <section class="toolbar">
              <div class="toolbar-status" aria-live="polite"><span class="status-dot"></span><span id="save-state">Առցանց տվյալներ</span></div>
              <div class="toolbar-actions">
                <button id="reset">Վերականգնել</button>
                <button id="print">Տպել</button>
                <button id="save" class="primary">Պահպանել</button>
              </div>
            </section>
            <section class="document">
              <div class="document-heading">
                <h2>Տեղեկանք</h2>
                <p>Էլեկտրոնային սարքավորումների վերաբերյալ՝ 29.07.2026 դրությամբ</p>
              </div>
              <div class="table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th rowspan="3">№</th>
                      <th rowspan="3">Սարքատեսակ</th>
                      <th rowspan="3">Մատակարարված սարքեր / հատ /</th>
                      <th rowspan="3">Կիրառված սարքեր / հատ /</th>
                      <th rowspan="3">Չկիրառված սարքեր / հատ /</th>
                      <th colspan="3">Պահեստում սարքերի՝ այդ թվում</th>
                      <th rowspan="3">Կորուստ</th>
                      <th rowspan="3">Տարբերություն</th>
                    </tr>
                    <tr>
                      <th rowspan="2">Սարքին</th>
                      <th colspan="2">Անսարք</th>
                    </tr>
                    <tr>
                      <th>Երաշխիքով</th>
                      <th>Առանց երաշխիքի</th>
                    </tr>
                  </thead>
                  <tbody>${tableRows()}</tbody>
                  <tfoot>${totalsRow()}</tfoot>
                </table>
              </div>
              <div id="validation" class="validation"></div>
              <div class="analysis-grid">
                <article class="chart-panel">
                  <div class="chart-heading"><div><p>Ընդհանուր պատկեր</p><h3>Սարքերի վիճակի կառուցվածքը</h3></div><span>խմբագրվող</span></div>
                  <div id="donut-area"></div>
                </article>
                <article class="chart-panel">
                  <div class="chart-heading"><div><p>Համեմատություն</p><h3>Վիճակն ըստ սարքատեսակի</h3></div><span>4 տեսակ</span></div>
                  <div id="stack-area"></div>
                </article>
              </div>
            </section>
          </main>
          <dialog id="pin-dialog" class="pin-dialog">
            <form id="pin-form" class="pin-form">
              <h3>Խմբագրման հաստատում</h3>
              <p>Տվյալները առցանց պահպանելու համար մուտքագրեք 6-նիշ PIN կոդը։</p>
              <label>
                PIN կոդ
                <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required />
              </label>
              <div class="pin-actions">
                <button id="pin-cancel" type="button">Չեղարկել</button>
                <button class="primary" type="submit">Հաստատել</button>
              </div>
            </form>
          </dialog>
          <footer><span>Աղբյուր՝ Սարքեր 29.07.2026.csv</span><span>Տվյալները համաժամացվում են Google Sheet-ի հետ</span></footer>
        `;
        bindInputs();
        updateDerived();
      }

      async function loadOnlineData() {
        try {
          const response = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
          const result = await response.json();
          if (!result.ok || !Array.isArray(result.rows) || result.rows.length !== 4) {
            throw new Error("LOAD_FAILED");
          }
          initialRows = structuredClone(result.rows);
          rows = structuredClone(result.rows);
          render();
          const updatedAt = result.rows.find(row => row.updatedAt)?.updatedAt;
          document.querySelector("#save-state").textContent =
            `Առցանց տվյալները բեռնված են${updatedAt ? ` · ${updatedAt}` : ""}`;
        } catch (error) {
          initialRows = structuredClone(PUBLISHED_ROWS);
          rows = structuredClone(PUBLISHED_ROWS);
          render();
          document.querySelector("#save-state").textContent =
            "Ցանցային տվյալները հասանելի չեն · ցուցադրվում է պահուստային տարբերակը";
        }
      }

      loadOnlineData();
    </script>
  </body>
</html>
